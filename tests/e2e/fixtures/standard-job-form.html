<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Senior Full Stack Engineer - Job Application</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 650px; margin: 40px auto; padding: 20px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; color: #333; }
    input[type="text"], input[type="email"], input[type="tel"], input[type="number"], select, textarea {
      width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px;
    }
    .radio-group label { display: inline-block; margin-right: 15px; font-weight: normal; }
    button[type="submit"] { padding: 12px 24px; background: #2557a7; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
    button[type="submit"]:hover { background: #1b3f7a; }
    #confirmation { display: none; margin-top: 25px; padding: 20px; background: #e6ffed; border: 1px solid #34d058; border-radius: 6px; }
    #confirmation h2 { margin-top: 0; color: #155724; }
  </style>
</head>
<body>
  <h1>Senior Full Stack Engineer</h1>
  <p class="subtitle">CloudScale Infrastructure &bull; Remote</p>

  <form id="e2e-application-form" onsubmit="event.preventDefault(); document.getElementById('confirmation').style.display = 'block'; document.getElementById('e2e-application-form').style.display = 'none';">
    <div class="form-group">
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" name="fullName" required placeholder="Alex Rivera">
    </div>

    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required placeholder="alex.rivera.dev@example.com">
    </div>

    <div class="form-group">
      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" required placeholder="+1-555-019-2834">
    </div>

    <div class="form-group">
      <label for="experience">How many years of experience with TypeScript do you have?</label>
      <input type="number" id="experience" name="experience" required min="0" max="30">
    </div>

    <div class="form-group">
      <label for="education">Highest Level of Education</label>
      <select id="education" name="education">
        <option value="">Select an option</option>
        <option value="High School">High School</option>
        <option value="Associate's Degree">Associate's Degree</option>
        <option value="Bachelor's Degree">Bachelor's Degree</option>
        <option value="Master's Degree">Master's Degree</option>
      </select>
    </div>

    <div class="form-group radio-group">
      <label>Are you legally authorized to work in the United States?</label>
      <label><input type="radio" name="workAuth" value="Yes" required> Yes</label>
      <label><input type="radio" name="workAuth" value="No"> No</label>
    </div>

    <div class="form-group radio-group">
      <label>Will you now or in the future require visa sponsorship?</label>
      <label><input type="radio" name="sponsorship" value="Yes" required> Yes</label>
      <label><input type="radio" name="sponsorship" value="No"> No</label>
    </div>

    <div class="form-group">
      <label for="resume">Upload Resume</label>
      <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx">
    </div>

    <button type="submit" id="submit-btn">Submit Application</button>
  </form>

  <div id="confirmation">
    <h2>Application submitted</h2>
    <p>Thank you for your application! Your application was successfully submitted.</p>
  </div>
</body>
</html>
