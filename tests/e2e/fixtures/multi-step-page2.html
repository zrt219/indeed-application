<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Step 2 - Review and Submit</title>
</head>
<body>
  <h1>Step 2: Review and Submit</h1>
  <form id="step2-form" onsubmit="event.preventDefault(); document.getElementById('confirmation').style.display = 'block'; document.getElementById('step2-form').style.display = 'none';">
    <label for="phone">Phone Number</label>
    <input type="tel" id="phone" name="phone" required>

    <label>Are you legally authorized to work in the United States?</label>
    <label><input type="radio" name="workAuth" value="Yes"> Yes</label>
    <label><input type="radio" name="workAuth" value="No"> No</label>

    <button type="submit" id="submit-btn">Submit Application</button>
  </form>

  <div id="confirmation" style="display:none;">
    <h2>Application submitted</h2>
    <p>Your application was successfully submitted. Thank you for applying!</p>
  </div>
</body>
</html>
