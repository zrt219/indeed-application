<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Step 1 - Contact Information</title>
</head>
<body>
  <h1>Step 1: Contact Details</h1>
  <form id="step1-form" action="multi-step-page2.html" method="GET">
    <label for="fullName">Full Name</label>
    <input type="text" id="fullName" name="fullName" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <button type="button" id="next-btn" onclick="document.getElementById('step1-form').submit()">Continue</button>
  </form>
</body>
</html>
