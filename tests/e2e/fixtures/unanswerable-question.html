<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Screening with Unknown Questions</title>
</head>
<body>
  <h1>Autonomous Systems Engineer Application</h1>
  <form id="screening-form">
    <div class="form-group">
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" name="fullName" value="Alex Rivera" required>
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="alex.rivera.dev@example.com" required>
    </div>
    <div class="form-group">
      <label for="pilotCert">Do you hold an active FAA Commercial Pilot License or Airline Transport Pilot rating?</label>
      <input type="text" id="pilotCert" name="pilotCert" required>
    </div>
    <button type="submit" id="submit-btn">Submit Application</button>
  </form>
</body>
</html>
