<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multi-Step Application</title>
  <style>
    .step { display: none; }
    .step.active { display: block; }
    #confirmation { display: none; margin-top: 20px; padding: 15px; background: #e6ffed; border: 1px solid #34d058; }
  </style>
</head>
<body>
  <h1>Platform Engineer Multi-Step Application</h1>
  <form id="multi-form">
    <!-- Step 1 -->
    <div id="step-1" class="step active">
      <h3>Step 1: Contact Information</h3>
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" name="fullName" required>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
      <button type="button" id="next-btn" onclick="goToStep(2)">Continue</button>
    </div>

    <!-- Step 2 -->
    <div id="step-2" class="step">
      <h3>Step 2: Experience & Authorization</h3>
      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" required>
      <label>Are you legally authorized to work in the United States?</label>
      <label><input type="radio" name="workAuth" value="Yes"> Yes</label>
      <label><input type="radio" name="workAuth" value="No"> No</label>
      <button type="submit" id="submit-btn" onclick="event.preventDefault(); finishApplication();">Submit Application</button>
    </div>
  </form>

  <div id="confirmation">
    <h2>Application submitted</h2>
    <p>Your application was successfully submitted. Thank you for applying!</p>
  </div>

  <script>
    function goToStep(stepNum) {
      document.getElementById('step-1').classList.remove('active');
      document.getElementById('step-2').classList.add('active');
    }
    function finishApplication() {
      document.getElementById('multi-form').style.display = 'none';
      document.getElementById('confirmation').style.display = 'block';
    }
  </script>
</body>
</html>
