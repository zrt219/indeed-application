<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Indeed Unified Application Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { width: 360px; padding: 16px; background: #090d16; color: #f8fafc; }
    .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1e293b; padding-bottom: 10px; margin-bottom: 12px; }
    .title { font-size: 13px; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 6px; }
    .status-badge { font-size: 10px; padding: 2px 7px; border-radius: 9999px; background: #1e293b; color: #94a3b8; }
    .status-badge.online { background: #064e3b; color: #34d399; }
    .server-select { margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: #94a3b8; }
    .server-select select { background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 4px; padding: 2px 6px; font-size: 11px; }
    .card { background: #0f172a; border-radius: 8px; padding: 12px; border: 1px solid #1e293b; margin-bottom: 12px; }
    .job-title { font-size: 13px; font-weight: 600; color: #f1f5f9; margin-bottom: 4px; line-height: 1.3; }
    .job-meta { font-size: 11px; color: #94a3b8; display: flex; flex-direction: column; gap: 2px; }
    .actions { display: flex; flex-direction: column; gap: 8px; }
    button { width: 100%; padding: 9px; border-radius: 6px; font-weight: 600; font-size: 12px; cursor: pointer; border: none; transition: 0.15s ease; }
    .btn-queue { background: #2563eb; color: #fff; }
    .btn-queue:hover { background: #1d4ed8; }
    .btn-track { background: #059669; color: #fff; }
    .btn-track:hover { background: #047857; }
    .btn-secondary { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; }
    .btn-secondary:hover { background: #334155; }
    .lifecycle-group { display: flex; gap: 6px; align-items: center; margin-top: 4px; }
    .lifecycle-group select { flex: 1; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; padding: 7px; font-size: 11px; }
    .lifecycle-group button { width: auto; padding: 7px 12px; }
    .msg { font-size: 11px; text-align: center; margin-top: 8px; min-height: 16px; }
    .msg.success { color: #34d399; }
    .msg.error { color: #f87171; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <span>🚀</span> Unified Indeed Agent
    </div>
    <span id="apiStatus" class="status-badge">Checking...</span>
  </div>

  <div class="server-select">
    <span>Target Backend:</span>
    <select id="endpointSelect">
      <option value="https://job-application-agent-kohl.vercel.app">Vercel Cloud</option>
      <option value="http://localhost:3000">Localhost (Worker)</option>
    </select>
  </div>

  <div id="jobCard" class="card">
    <div id="jobTitle" class="job-title">Detecting active Indeed job...</div>
    <div class="job-meta">
      <span id="jobCompany">-</span>
      <span id="jobLocation">-</span>
    </div>
  </div>

  <div class="actions">
    <!-- 1. Send to Playwright autonomous queue -->
    <button id="queueBtn" class="btn-queue" disabled>⚡ Send to Auto-Apply Queue</button>
    
    <!-- 2. Track as manually applied -->
    <button id="trackAppliedBtn" class="btn-track" disabled>✓ Mark as Applied (Track Manually)</button>

    <!-- 3. Update Lifecycle Status -->
    <div class="lifecycle-group">
      <select id="statusSelect">
        <option value="INTERVIEW">Status: Interview</option>
        <option value="OFFER">Status: Offer</option>
        <option value="FOLLOW_UP">Status: Follow-Up</option>
        <option value="REJECTED">Status: Rejected</option>
        <option value="WITHDRAWN">Status: Withdrawn</option>
      </select>
      <button id="updateStatusBtn" class="btn-secondary" disabled>Update</button>
    </div>

    <!-- 4. Open dashboard -->
    <button id="dashboardBtn" class="btn-secondary">Open Web Dashboard</button>
  </div>

  <div id="feedbackMsg" class="msg"></div>

  <script src="popup.js"></script>
</body>
</html>
