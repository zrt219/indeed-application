<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Indeed Agent Importer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { width: 340px; padding: 16px; background: #0f172a; color: #f8fafc; }
    .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155; padding-bottom: 12px; margin-bottom: 14px; }
    .title { font-size: 14px; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 6px; }
    .status-badge { font-size: 11px; padding: 2px 8px; border-radius: 9999px; background: #1e293b; color: #94a3b8; }
    .status-badge.online { background: #064e3b; color: #34d399; }
    .card { background: #1e293b; border-radius: 8px; padding: 12px; border: 1px solid #334155; margin-bottom: 14px; }
    .job-title { font-size: 14px; font-weight: 600; color: #f1f5f9; margin-bottom: 4px; line-height: 1.3; }
    .job-meta { font-size: 12px; color: #94a3b8; margin-bottom: 8px; display: flex; flex-direction: column; gap: 2px; }
    .salary-badge { display: inline-block; font-size: 11px; background: #0284c7; color: #fff; padding: 2px 6px; border-radius: 4px; font-weight: 500; margin-top: 4px; }
    .actions { display: flex; flex-direction: column; gap: 8px; }
    button { width: 100%; padding: 10px; border-radius: 6px; font-weight: 600; font-size: 13px; cursor: pointer; border: none; transition: 0.15s ease; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #334155; color: #e2e8f0; }
    .btn-secondary:hover { background: #475569; }
    .msg { font-size: 12px; text-align: center; margin-top: 8px; min-height: 18px; }
    .msg.success { color: #34d399; }
    .msg.error { color: #f87171; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <span>🚀</span> Indeed Agent
    </div>
    <span id="apiStatus" class="status-badge">Checking API...</span>
  </div>

  <div id="jobCard" class="card">
    <div id="jobTitle" class="job-title">Detecting active Indeed job...</div>
    <div class="job-meta">
      <span id="jobCompany">-</span>
      <span id="jobLocation">-</span>
      <span id="jobSalary" class="salary-badge" style="display: none;">-</span>
    </div>
  </div>

  <div class="actions">
    <button id="queueBtn" class="btn-primary" disabled>Send to Auto-Apply Queue</button>
    <button id="dashboardBtn" class="btn-secondary">Open Agent Dashboard</button>
  </div>

  <div id="feedbackMsg" class="msg"></div>

  <script src="popup.js"></script>
</body>
</html>
